name: release

# Only build a release when a version tag is pushed (e.g. v0.2.0).
# Day-to-day pushes to main do NOT build - that keeps CI quota for tags only.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}   # allow a manual run from the Actions tab

permissions:
  contents: write         # needed to create the GitHub Release

jobs:
  # ---------------------------------------------------------------- tests
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev deps
        run: pip install pytest
      - name: Run tests
        run: pytest -q

  # ------------------------------------------------------------- core exe
  core:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Build core (onedir)
        shell: pwsh
        run: |
          # Args come from the shared manifest so the CI build cannot drift
          # from build_release.ps1 (it previously lost --add-data data).
          # Do not name this $args - that is a PowerShell automatic variable.
          $pyiArgs = @(py -3.12 build_manifest.py pyinstaller-args)
          py -3.12 -m PyInstaller @pyiArgs
      - name: Collect default config
        run: Copy-Item .env.example dist/F1Engineer/.env.example
      - name: Zip core
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          py -3.12 tools/make_zip.py "dist/F1Engineer-core-$v-win64.zip" dist/F1Engineer
      - name: Upload core artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-zip
          path: dist/F1Engineer-core-*-win64.zip

  # ------------------------------------------------- release + checksums
  release:
    needs: [core]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten artifacts
        run: |
          find dist -name "*.zip" -exec mv {} dist/ \;
      - name: Compute SHA256
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          body: |
            ## F1 Race Engineer ${{ github.ref_name }}

            ### 下载哪个？
            - **F1Engineer-core-*.zip**（约 40MB）：解压双击 `F1Engineer.exe`。
              已内置音频依赖（sounddevice/numpy），语音走云端 STT + Windows
              SAPI/Piper，填个 API key 即可；本地离线识别需用全量包。
            - **F1Engineer-full-*.zip**（约 1.5GB，本地构建上传）：内置本地语音识别
              （SenseVoice-Small / faster-whisper + 模型），完全离线，解压即用。

            ### 校验
            下载后请核对 `SHA256SUMS.txt` 中的哈希值。

            ### 安全说明
            本项目只被动接收游戏官方 UDP 遥测，按键检测用 Raw Input（只订阅），
            不读写游戏内存、不模拟输入、不绕过反作弊。详见 README。

# NOTE: the full pack is NOT built in CI - it bundles the local whisper model
# (~460MB) and ctranslate2 deps (~264MB), too large for GitHub-hosted runners
# and artifacts. Build it locally with:
#     powershell -File build_release.ps1 -Version <v> -FullOnly
