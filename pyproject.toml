[project]
name = "f1-race-engineer"
version = "0.2.0"
description = "Read-only AI race engineer for F1 UDP telemetry"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# Local speech recognition (install into the project's stt_lib/ per README).
voice = ["faster-whisper", "sounddevice"]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["lib", "stt_lib", "stt_models", "png_src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["."]
norecursedirs = ["stt_lib", "stt_models", "lib", "sessions", "build", "build_lib", "dist", "python-embed", ".git", ".pytest_cache", "__pycache__", "png_src"]
python_files = ["tests_*.py", "test_*.py"]
