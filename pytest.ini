[pytest]
# All tests live under tests/ (migrated from the root-level tests_*.py scripts
# in T0). Script-style tests now expose a test_main() wrapper instead.
testpaths = tests
python_files = test_*.py
norecursedirs = stt_lib stt_models lib sessions build build_lib dist python-embed .git .pytest_cache __pycache__ png_src tools
addopts = -q
