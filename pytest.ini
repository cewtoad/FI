[pytest]
# The project's test scripts are named tests_*.py (not the pytest default
# test_*.py). Teach pytest to collect them without renaming any file.
python_files = tests_*.py test_*.py
# Only collect from the project root, never from vendored/local deps.
testpaths = .
norecursedirs = stt_lib stt_models lib sessions .git .pytest_cache __pycache__ png_src
addopts = -q
